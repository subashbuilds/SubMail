<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="wordmark__icon" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="submail-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4facfe"/>
      <stop offset="1" stop-color="#1548c8"/>
    </linearGradient>
  </defs>
  <!-- rounded blue envelope body -->
  <rect x="6" y="16" width="44" height="34" rx="7" fill="url(#submail-mark)"/>
  <!-- white envelope flap -->
  <path d="M8.5 19.5 28 34.5 47.5 19.5" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- scattered pixel squares (digital-mail motif from the SubMail logo) -->
  <rect x="45" y="5" width="9" height="9" rx="2" fill="#2f7cf6"/>
  <rect x="56" y="13" width="6.5" height="6.5" rx="1.6" fill="#7db4ff"/>
  <rect x="37" y="4" width="5.5" height="5.5" rx="1.4" fill="#1548c8"/>
</svg>

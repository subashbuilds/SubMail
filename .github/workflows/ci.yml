name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so queued checks don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege by default; the deploy job needs no elevated GitHub
# permissions since it authenticates to Cloudflare via a secret, not via
# GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    name: Type check, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22: required by wrangler 4.137+ and the miniflare version
          # pulled in by @cloudflare/vitest-pool-workers (both declare
          # engines.node >= 22; a Node 20 setup fails at `npm ci`/test time).
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (type-check-only build; wrangler bundles at deploy time)
        run: npm run build

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Deploys only run after `test` succeeds — a failing type check, lint,
    # or test run blocks this job entirely (spec §47: "do not deploy if
    # tests fail").
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (remote)
        # --env production is required: all real config lives under
        # [env.production.*] in wrangler.toml.
        run: npx wrangler d1 migrations apply submail-db --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    # Notes:
    #  - CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are GitHub Actions
    #    encrypted secrets (Settings -> Secrets and variables -> Actions).
    #    GitHub automatically redacts any secret value that appears in step
    #    output, but nothing in this workflow ever echoes them regardless.
    #  - The `production` environment can be configured with required
    #    reviewers/branch protection under Settings -> Environments for an
    #    extra manual gate before deploys run, if desired.
